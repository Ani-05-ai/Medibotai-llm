<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Medibot &mdash; reference-grounded medical Q&amp;A</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
	<main class="chat-shell">
		<header class="chat-header">
			<div class="brand">
				<span class="brand-mark" aria-hidden="true"></span>
				<h1>Medibot</h1>
			</div>
			<p class="tagline">Answers grounded in one reference text</p>
		</header>

		<div class="disclaimer" role="note">
			{{ disclaimer }}
		</div>

		<section id="log" class="log" aria-live="polite" aria-label="Conversation"></section>

		<p id="status" class="status" aria-live="polite"></p>

		<form id="composer" class="composer">
			<label for="text" class="sr-only">Ask a question</label>
			<input
				id="text"
				name="msg"
				type="text"
				autocomplete="off"
				maxlength="500"
				placeholder="Ask about a condition, treatment, or symptom..."
				required
			/>
			<button type="submit" id="send">Ask</button>
		</form>
	</main>

	<template id="bot-message-template">
		<div class="bubble bubble--bot">
			<p class="bubble-text"></p>
			<ul class="sources"></ul>
		</div>
	</template>

	<script>
		(function () {
			const log = document.getElementById("log");
			const form = document.getElementById("composer");
			const input = document.getElementById("text");
			const status = document.getElementById("status");
			const botTemplate = document.getElementById("bot-message-template");

			function addUserMessage(text) {
				const bubble = document.createElement("div");
				bubble.className = "bubble bubble--user";
				const p = document.createElement("p");
				p.className = "bubble-text";
				p.textContent = text; // textContent, never innerHTML: avoids XSS from user input
				bubble.appendChild(p);
				log.appendChild(bubble);
			}

			function addBotMessage(answer, sources) {
				const node = botTemplate.content.cloneNode(true);
				node.querySelector(".bubble-text").textContent = answer; // textContent: avoids XSS from model output
				const sourcesEl = node.querySelector(".sources");
				(sources || []).forEach(function (s) {
					const li = document.createElement("li");
					li.textContent = s.page ? (s.source + " \u00b7 p. " + s.page) : s.source;
					sourcesEl.appendChild(li);
				});
				log.appendChild(node);
			}

			function addErrorMessage(text) {
				const bubble = document.createElement("div");
				bubble.className = "bubble bubble--error";
				bubble.textContent = text;
				log.appendChild(bubble);
			}

			function scrollToBottom() {
				log.scrollTop = log.scrollHeight;
			}

			form.addEventListener("submit", function (event) {
				event.preventDefault();
				const question = input.value.trim();
				if (!question) return;

				addUserMessage(question);
				input.value = "";
				input.disabled = true;
				status.textContent = "Thinking...";
				scrollToBottom();

				const body = new URLSearchParams();
				body.set("msg", question);

				fetch("/get", {
					method: "POST",
					headers: { "Content-Type": "application/x-www-form-urlencoded" },
					body: body.toString(),
				})
					.then(function (response) {
						return response.json().then(function (data) {
							return { ok: response.ok, data: data };
						});
					})
					.then(function (result) {
						if (result.ok) {
							addBotMessage(result.data.answer, result.data.sources);
						} else {
							addErrorMessage(result.data.error || "Something went wrong. Please try again.");
						}
					})
					.catch(function () {
						addErrorMessage("Couldn't reach the server. Check your connection and try again.");
					})
					.finally(function () {
						input.disabled = false;
						status.textContent = "";
						input.focus();
						scrollToBottom();
					});
			});
		})();
	</script>
</body>
</html>
